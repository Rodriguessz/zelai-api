name: CI

# Roda em todo PR para a main (barra código quebrado antes do merge)
# e em todo push na main (mantém o status da main visível).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Também é chamado pelo CD antes de cada deploy (mesmo código que vai para produção).
  workflow_call:
    inputs:
      ref:
        description: Commit a testar
        type: string
        required: false

# Menor privilégio: o workflow só lê o código.
permissions:
  contents: read

# Se um novo commit chegar no mesmo PR, cancela a execução antiga.
# O nome do workflow entra no grupo: quando o CD chama este CI, ele não
# cancela (nem é cancelado por) o CI disparado pelo mesmo push na main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PostgreSQL real para os testes de contrato dos repositórios e das migrações.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zelai
          POSTGRES_PASSWORD: zelai-ci
          POSTGRES_DB: zelai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zelai -d zelai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configurar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (exatamente as do package-lock)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validar contrato OpenAPI
        run: npm run lint:openapi

      - name: Validar scripts de infraestrutura (shellcheck)
        run: shellcheck infra/*.sh scripts/*.sh

      - name: Testes com cobertura (mínimo 70%)
        run: npm run test:coverage
        env:
          # Banco descartável do próprio job (não é segredo).
          TEST_DATABASE_URL: postgres://zelai:zelai-ci@localhost:5432/zelai_test

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  security-audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configurar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Falha se alguma dependência de produção tiver vulnerabilidade alta ou crítica.
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=high

      # Só informa sobre dependências de desenvolvimento, sem bloquear.
      - name: npm audit (desenvolvimento, informativo)
        run: npm audit --audit-level=high || echo "::warning::Há vulnerabilidades em dependências de desenvolvimento"
