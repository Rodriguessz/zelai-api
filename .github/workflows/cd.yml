name: CD

# Publica a API na Azure a cada merge na main.
# Rollback: Actions → CD → Run workflow → informe o commit anterior em "ref".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch ou tag a publicar (use um commit anterior para fazer rollback)
        required: false
        default: main

permissions:
  contents: read

# Um deploy por vez, e nunca cancela um deploy no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1. Mesmo que a main só receba PR com CI verde, testamos de novo o código exato
  #    que vai para produção (inclusive em deploy manual de rollback).
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # 2. Gera o pacote uma única vez; o mesmo artefato testado é o publicado.
  build:
    name: Build do pacote
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.AZURE_WEBAPP_NAME != ''
    outputs:
      commit: ${{ steps.info.outputs.commit }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configurar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar só dependências de produção
        run: npm ci --omit=dev

      - name: Gravar build-info.json (commit publicado)
        id: info
        run: |
          COMMIT="$(git rev-parse HEAD)"
          echo "{\"commit\":\"${COMMIT}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > build-info.json
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Empacotar
        run: >
          zip -qr app.zip .
          -x '.git/*' '.github/*' 'tests/*' 'coverage/*' 'infra/*' 'docs/*' 'scripts/*'
          '.env*' 'docker-compose.yml' 'eslint.config.js' 'jest.config.js' 'redocly.yaml'

      - name: Publicar artefato
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: app.zip
          retention-days: 30

  # 3. Publica no App Service e confirma com o smoke test.
  deploy:
    name: Deploy na Azure
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/docs
    permissions:
      contents: read
      id-token: write # necessário para o login OIDC (sem senha)
    env:
      APP_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
      USE_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Baixar script de smoke test
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Baixar pacote
        uses: actions/download-artifact@v6
        with:
          name: app

      - name: Login na Azure (OIDC, sem senha)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy no App Service (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip

      # Plano B, para contas que não podem criar a identidade OIDC (veja docs/DEPLOY.md).
      - name: Deploy no App Service (publish profile)
        if: env.USE_OIDC != 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Smoke test (versão nova no ar?)
        run: bash scripts/smoke-test.sh "$APP_URL" "${{ needs.build.outputs.commit }}"

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status == 'success' && '✅ concluído' || '❌ falhou' }}"
            echo "- Commit: \`${{ needs.build.outputs.commit }}\`"
            echo "- API: ${APP_URL}/health"
            echo "- Swagger: ${APP_URL}/docs"
            echo "- Rollback: Actions → CD → Run workflow → informe o commit anterior em **ref**"
          } >> "$GITHUB_STEP_SUMMARY"

  # Enquanto a Azure não estiver configurada, avisa em vez de falhar.
  aguardando-configuracao:
    name: Azure ainda não configurada
    needs: ci
    runs-on: ubuntu-latest
    if: vars.AZURE_WEBAPP_NAME == ''
    steps:
      - run: |
          echo "::notice::Deploy pulado: defina a variável AZURE_WEBAPP_NAME e os secrets do environment 'production' (veja docs/DEPLOY.md)."
