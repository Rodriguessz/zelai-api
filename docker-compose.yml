# PostgreSQL local para desenvolvimento: docker compose up -d
# Depois use DATABASE_URL=postgres://zelai:zelai@localhost:5432/zelai
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zelai
      POSTGRES_PASSWORD: zelai # apenas para desenvolvimento local
      POSTGRES_DB: zelai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zelai -d zelai']
      interval: 5s
      retries: 10

volumes:
  pgdata:
